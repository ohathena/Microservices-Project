services:
  customer:
    build:
      dockerfile: Dockerfile
      context: ./customer
    container_name: customer
    ports:
      - "8001:8001"
    restart: always
    volumes:
      - .:/app/
      - /app/customer/node_modules
    env_file:
      - ./customer/.env.dev
    depends_on:
      rabbitmq:
        condition: service_healthy

  products:
    build:
      dockerfile: Dockerfile
      context: ./products
    container_name: products
    ports:
      - "8002:8002"
    restart: always
    volumes:
      - ./products:/app/products
      - /app/products/node_modules
    env_file:
      - ./products/.env.dev
    depends_on:
      - mongodb
      - rabbitmq

  mongodb:
    image: mongo:7
    container_name: products-mongodb
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - products-mongodb-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: microservices-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 5s
      timeout: 5s
      retries: 24

  nginx-proxy:
    build:
      dockerfile: Dockerfile
      context: ./proxy
    container_name: nginx-proxy
    depends_on:
      - customer
      - products
    ports:
      - "80:80"
    restart: always
  
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  mail:
    build:
      dockerfile: Dockerfile
      context: ./mail
    container_name: mail
    ports:
      - "8004:8004"
    restart: always
    volumes:
      - ./mail:/app/mail
    env_file:
      - ./mail/.env.dev
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  products-mongodb-data:
