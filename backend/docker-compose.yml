services:
  customer:
    build:
      dockerfile: Dockerfile
      context: ./customer
    container_name: customer
    ports:
      - "8001:8001"
    restart: always
    volumes:
      - .:/app/
      - /app/customer/node_modules
    env_file:
      - ./customer/.env.dev

  products:
    build:
      dockerfile: Dockerfile
      context: ./products
    container_name: products
    ports:
      - "8002:8002"
    restart: always
    volumes:
      - ./products:/app/products
      - /app/products/node_modules
    env_file:
      - ./products/.env.dev
    depends_on:
      - mongodb
      - rabbitmq

  mongodb:
    image: mongo:7
    container_name: products-mongodb
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - products-mongodb-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: microservices-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  news:
    build:
      dockerfile: Dockerfile
      context: ./news
    container_name: news
    ports:
      - "8004:8004"
    restart: always
    volumes:
      - ./news:/app/news
      - /app/news/node_modules
    env_file:
      - ./news/.env.dev
    depends_on:
      - mongodb

  nginx-proxy:
    build:
      dockerfile: Dockerfile
      context: ./proxy
    container_name: nginx-proxy
    depends_on:
      - customer
      - products
      - news
    ports:
      - "80:80"
    restart: always


volumes:
  products-mongodb-data:
